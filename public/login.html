<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account</title><style>body{margin:0;background:#050508;color:#e8eaf0;font-family:Arial;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,92vw);padding:26px;border:1px solid #ffffff15;border-radius:18px;background:#ffffff05}h1{color:#00ff88}input,button{display:block;width:100%;padding:12px;margin:12px 0;border-radius:9px}input{background:#111;color:white;border:1px solid #ffffff22}button{border:0;background:linear-gradient(120deg,#00ff88,#00cfff);font-weight:bold}#msg{font-size:13px;color:#a6a6a6}</style></head><body><form class="box" id="form"><h1>Create Account</h1><input name="username" placeholder="Username" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (6+ characters)" required minlength="6"><button>Create Account</button><p id="msg"></p></form><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),data=Object.fromEntries(f.entries()),m=document.getElementById('msg');m.textContent='Creating account...';try{let r=await fetch('/api/user/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();m.textContent=j.status?'Account created.':(j.message||'Could not create account.')}catch(err){m.textContent='Request failed: '+err.message}};</script></body></html>
